<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="siteTitle">LUGARES | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00d2ff; --gold: #ffd700; --money: #10b981; --red: #ff3b30; --bg: #0f2027; --text: #ffffff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.5s; overflow-x: hidden; }
        
        body.theme-gold { --bg: #000000; --accent: #ffd700; --text: #ffffff; }
        body.theme-light { --bg: #f4f7f6; --accent: #0056b3; --text: #1a1a1a; }

        .full-banner { width: 100%; background: rgba(0, 0, 0, 0.3); padding: 40px 100px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
        .main-logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--accent); background: white; object-fit: contain; }
        .brand-name { font-family: 'Poppins', sans-serif; color: var(--accent); font-size: 60px; letter-spacing: 8px; text-transform: uppercase; line-height: 0.8; }
        
        .sub-nav { width: 100%; background: rgba(0, 0, 0, 0.6); padding: 20px 0; display: flex; justify-content: center; gap: 20px; position: sticky; top: 0; z-index: 1000; }
        .nav-link { color: var(--text); text-decoration: none; font-weight: bold; cursor: pointer; opacity: 0.6; padding: 10px 18px; border-radius: 30px; transition: 0.3s; font-size: 13px; border: 1px solid transparent; }
        .nav-link.active { color: var(--accent); border-color: var(--accent); opacity: 1; }
        
        .content-window { display: none; padding: 40px; max-width: 1200px; margin: auto; }
        .data-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border-left: 5px solid var(--accent); margin-bottom: 10px; position: relative; }
        
        .log-entry { font-family: monospace; font-size: 12px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; }
        .status-tag { font-size: 10px; opacity: 0.5; margin-top: 5px; display: block; }
        .del-btn { position: absolute; right: 20px; top: 20px; color: var(--red); cursor: pointer; font-size: 11px; opacity: 0.4; border: 1px solid var(--red); padding: 3px 8px; border-radius: 5px; }
        .del-btn:hover { opacity: 1; background: rgba(255,59,48,0.1); }

        input { width:100%; padding:15px; background:rgba(0,0,0,0.1); border:1px solid #444; color:inherit; border-radius:10px; margin-bottom:10px; box-sizing: border-box; }
        
        .settings-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 28px; z-index: 2000; transition: 0.4s; }
        .settings-btn:hover { transform: rotate(90deg) scale(1.1); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-box { background: #1a1a1a; width: 450px; padding: 35px; border-radius: 25px; border: 2px solid var(--accent); color: white; }
    </style>
</head>
<body onload="initApp()">

    <div class="full-banner">
        <img src="C:\Users\speak\Desktop\lugares\logo.jpeg.png-removebg-preview.png" class="main-logo">
        <div class="brand-box">
            <b id="displayBrand" class="brand-name">LUGARES</b>
            <div style="text-align:right; font-size:14px; opacity:0.7">Worker Dashboard</div>
        </div>
    </div>

    <div class="sub-nav">
        <a id="btn-staff" class="nav-link" onclick="showSection('staff')">Staff</a>
        <a id="btn-exec" class="nav-link" onclick="showSection('exec')" style="color:var(--gold)">Executives</a>
        <a id="btn-finance" class="nav-link" onclick="showSection('finance')" style="color:var(--money)">Bank Ledger</a>
        <a id="btn-logs" class="nav-link" onclick="showSection('logs')" style="color:var(--red)">Security Logs</a>
        <a id="btn-req" class="nav-link" onclick="showSection('req')">Requests</a>
        <a id="btn-add" class="nav-link" onclick="showSection('add')">Register</a>
    </div>

    <div id="win-staff" class="content-window"><h2>Staff Directory</h2><div id="staffList"></div></div>
    <div id="win-exec" class="content-window"><h2>Executive Board</h2><div id="execList"></div></div>
    <div id="win-req" class="content-window"><h2>Customer Requests</h2><div id="reqList"></div></div>
    
    <div id="win-logs" class="content-window">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--red)">Audit Trail & Security Logs</h2>
            <button onclick="clearAuditLogs()" style="background:none; border:1px solid var(--red); color:var(--red); padding:5px 15px; border-radius:5px; cursor:pointer;">Wipe Logs</button>
        </div>
        <input type="text" id="logSearch" placeholder="Search logs..." onkeyup="renderLogs()">
        <div id="auditLogList" style="background:rgba(0,0,0,0.2); border-radius:10px; padding:10px; margin-top:10px; max-height:450px; overflow-y:auto;"></div>
    </div>

    <div id="win-finance" class="content-window">
        <div id="fin-lock" style="text-align:center; padding:50px; border:1px dashed var(--red);">
            <h3>🔒 Restricted Access</h3>
            <input type="password" id="finPass" placeholder="Master Password">
            <button onclick="unlockFin()" style="padding:15px 40px; background:var(--money); color:black; font-weight:bold; border:none; border-radius:10px; cursor:pointer;">AUTHORIZE</button>
        </div>
        <div id="fin-content" style="display:none;">
            <h2 style="color:var(--money)">Financial Ledger</h2>
            <div id="txList"></div>
        </div>
    </div>

    <div id="win-add" class="content-window">
        <h2>Register Personnel</h2>
        <input type="text" id="regN" placeholder="Full Name">
        <input type="text" id="regR" placeholder="Role (e.g. Executive Director)">
        <input type="password" id="regP" placeholder="Master Authorization">
        <button onclick="savePersonnel()" style="width:100%; padding:15px; background:var(--accent); color:black; font-weight:bold; border:none; border-radius:10px; cursor:pointer;">REGISTER</button>
    </div>

    <div class="settings-btn" onclick="openSettings()">⚙️</div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <h3 style="margin-top:0; color:var(--accent);">Settings</h3>
            <div style="background:rgba(255,59,48,0.1); padding:15px; border-radius:10px; border:1px solid var(--red); margin-bottom:20px;">
                <input type="password" id="oldP" placeholder="Old Password">
                <input type="password" id="newP" placeholder="New Password">
                <button onclick="changePass()" style="width:100%; padding:8px; background:var(--red); color:white; border:none; border-radius:5px; cursor:pointer;">CHANGE PASSWORD</button>
            </div>
            <button onclick="setTheme('default')" style="width:100%; padding:10px; background:#0f2027; color:#00d2ff; border:1px solid #00d2ff; cursor:pointer; margin-bottom:10px;">REVERT TO CYAN</button>
            <button onclick="closeSettings()" style="width:100%; background:none; border:none; color:white; opacity:0.5; cursor:pointer;">Close</button>
        </div>
    </div>

    <script>
        let MASTER = localStorage.getItem('lug_master') || "Black";
        let BRAND = localStorage.getItem('lug_brand') || "LUGARES";

        function initApp() {
            applyBrand();
            showSection('staff');
            setTheme(localStorage.getItem('lug_theme') || 'default');
            logSecurity("SYSTEM REBOOT: worker.0 Initialized");
        }

        function logSecurity(action) {
            let logs = JSON.parse(localStorage.getItem('lug_security_logs')) || [];
            logs.unshift(`[${new Date().toLocaleString()}] ${action}`);
            localStorage.setItem('lug_security_logs', JSON.stringify(logs.slice(0, 100)));
        }

        function applyBrand() {
            document.getElementById('displayBrand').innerText = BRAND;
            document.getElementById('siteTitle').innerText = BRAND + " | Portal";
        }

        function showSection(id) {
            document.querySelectorAll('.content-window').forEach(w => w.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('win-' + id).style.display = 'block';
            document.getElementById('btn-' + id).classList.add('active');
            render();
        }

        function unlockFin() {
            if(document.getElementById('finPass').value === MASTER) {
                document.getElementById('fin-lock').style.display = 'none';
                document.getElementById('fin-content').style.display = 'block';
                logSecurity("ACCESS GRANTED: Bank Ledger Viewed");
                render();
            } else { 
                logSecurity("FAILED ACCESS: Unauthorized Ledger Attempt");
                alert("Unauthorized."); 
            }
        }

        function savePersonnel() {
            const n = document.getElementById('regN').value;
            const r = document.getElementById('regR').value;
            if(document.getElementById('regP').value !== MASTER) return alert("Wrong Password");
            const key = r.toLowerCase().includes('executive') ? 'lug_execs' : 'lug_staff_v2';
            let list = JSON.parse(localStorage.getItem(key)) || [];
            list.push({name: n, role: r, lastActive: new Date().toLocaleString()});
            localStorage.setItem(key, JSON.stringify(list));
            logSecurity(`REGISTERED: ${n} (${r})`);
            render();
        }

        function deleteEntry(key, index) {
            if(prompt("Enter Master Password to delete:") === MASTER) {
                let list = JSON.parse(localStorage.getItem(key)) || [];
                logSecurity(`DELETED: ${list[index].name}`);
                list.splice(index, 1);
                localStorage.setItem(key, JSON.stringify(list));
                render();
            }
        }

        function changePass() {
            if(document.getElementById('oldP').value === MASTER) {
                MASTER = document.getElementById('newP').value;
                localStorage.setItem('lug_master', MASTER);
                logSecurity("CRITICAL: Master Password Changed");
                alert("Success.");
                closeSettings();
            } else { alert("Failed."); }
        }

        function clearAuditLogs() {
            if(prompt("Master Password required to wipe audit trail:") === MASTER) {
                localStorage.setItem('lug_security_logs', JSON.stringify([]));
                logSecurity("AUDIT TRAIL WIPED BY ADMIN");
                render();
            }
        }

        function setTheme(t) {
            document.body.classList.remove('theme-gold', 'theme-light');
            if(t !== 'default') document.body.classList.add('theme-' + t);
            localStorage.setItem('lug_theme', t);
        }

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem('lug_security_logs')) || [];
            const query = document.getElementById('logSearch').value.toLowerCase();
            document.getElementById('auditLogList').innerHTML = logs
                .filter(l => l.toLowerCase().includes(query))
                .map(l => `<div class="log-entry">${l}</div>`).join('');
        }

        function render() {
            const staff = JSON.parse(localStorage.getItem('lug_staff_v2')) || [];
            document.getElementById('staffList').innerHTML = staff.map((s, i) => `<div class="data-card"><b>${s.name}</b><br>${s.role}<span class="status-tag">Last Active: ${s.lastActive}</span><div class="del-btn" onclick="deleteEntry('lug_staff_v2', ${i})">REMOVE</div></div>`).join('');
            const execs = JSON.parse(localStorage.getItem('lug_execs')) || [];
            document.getElementById('execList').innerHTML = execs.map((e, i) => `<div class="data-card" style="border-left-color:var(--gold)"><b>${e.name}</b><br>${e.role}<span class="status-tag">Board Activity: ${e.lastActive}</span><div class="del-btn" onclick="deleteEntry('lug_execs', ${i})">REMOVE</div></div>`).join('');
            const reqs = JSON.parse(localStorage.getItem('lug_requests')) || [];
            document.getElementById('reqList').innerHTML = reqs.map(r => `<div class="data-card"><b>${r.name}</b>: ${r.msg}</div>`).reverse().join('');
            renderLogs();
        }
    </script>
</body>
</html>
